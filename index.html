<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>대한민국 임시 정부 인터랙티브</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/engine.css">
</head>
<body>

<div id="app">
  <div id="stage">

    <!-- z1 : 배경 (배경 이미지를 쓰지 않으면 theme.css 의 #stage 그라데이션이 보인다) -->
    <div class="layer layer-bg"><img id="bg-img" alt=""></div>

    <!-- z2 : 영상 무대 -->
    <div class="layer layer-stage">
      <div id="screen">
        <video id="video" playsinline webkit-playsinline preload="auto"></video>
        <img id="screen-poster" alt="">
        <button type="button" id="tap-to-play" class="tap-to-play">
          <span class="tap-icon"></span><span class="tap-text">재생</span>
        </button>

        <!-- 재생 컨트롤 : 영상 위에 마우스를 올리면(터치는 탭) 나타난다.
             아이콘은 전부 CSS 도형 — 웹폰트/이미지에 의존하지 않는다. -->
        <div id="vctrl" class="vctrl" aria-hidden="true">

          <div id="vbar" class="vbar" tabindex="0" role="slider"
               aria-label="재생 위치" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <span class="vbar-track"></span>
            <span id="vbar-fill" class="vbar-fill"></span>
            <span id="vbar-knob" class="vbar-knob"></span>
          </div>

          <div class="vrow">
            <button type="button" id="v-toggle" class="vbtn vbtn-icon" aria-label="재생" title="재생">
              <span class="vi"></span>
            </button>
            <button type="button" id="v-replay" class="vbtn" title="처음부터 다시 재생">다시 보기</button>
            <span id="v-time" class="vtime">0:00 / 0:00</span>

            <span class="vright">
              <span class="vspeed" role="group" aria-label="재생 속도">
                <button type="button" class="vbtn vrate" data-rate="0.5" aria-pressed="false">0.5&#215;</button>
                <button type="button" class="vbtn vrate on" data-rate="1" aria-pressed="true">1&#215;</button>
                <button type="button" class="vbtn vrate" data-rate="2" aria-pressed="false">2&#215;</button>
              </span>

              <span class="vvol">
                <button type="button" id="v-mute" class="vbtn vbtn-icon vbtn-vol"
                        aria-label="음소거" title="음소거" aria-pressed="false">
                  <span class="ic-vol"><i></i><b></b></span>
                </button>
                <span id="vvolbar" class="vvolbar" tabindex="0" role="slider"
                      aria-label="음량" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
                  <span class="vvol-track"></span>
                  <span id="vvol-fill" class="vvol-fill"></span>
                  <span id="vvol-knob" class="vvol-knob"></span>
                </span>
              </span>

              <button type="button" id="v-full" class="vbtn vbtn-icon"
                      aria-label="전체화면" title="전체화면">
                <span class="ic-fs"><i></i></span>
              </button>
            </span>
          </div>

        </div>
      </div>
    </div>

    <!-- z3 : 프레임 장식 -->
    <div class="layer layer-frame"></div>

    <!-- z4 : 딤드 -->
    <div class="layer layer-dim" id="dim"></div>

    <!-- z5 : UI -->
    <div class="layer layer-ui">

      <!-- 머리글 : 배지 + 제목. 아래쪽 정렬이라 배지가 없으면 제목만 같은 자리에 남는다 -->
      <div class="node-head">
        <div class="node-head-in">
          <span id="node-badge" class="node-badge"></span>
          <h1 id="node-title" class="node-title"></h1>
        </div>
      </div>

      <div id="chrome" class="chrome"></div>

      <div id="actions" class="actions"></div>

      <!-- 선택 허브 -->
      <div id="choice" class="choice" aria-hidden="true">
        <div class="choice-panel">
          <div class="choice-inner">
            <div class="choice-mark" aria-hidden="true">?</div>
            <p id="choice-question" class="choice-question"></p>
            <ul id="choice-list" class="choice-list"></ul>
          </div>
        </div>
      </div>

      <!-- 진입 재생 버튼 -->
      <button type="button" id="hero-play" class="hero-play" aria-label="영상 재생">
        <span class="hero-triangle"></span>
      </button>

    </div>

    <div id="loading" class="loading" aria-hidden="true"><span></span><span></span><span></span></div>
  </div>
</div>

<audio id="aud-narr" preload="auto"></audio>
<audio id="aud-sfx" preload="auto"></audio>

<div id="debug" class="debug" hidden></div>

<!-- 콘텐츠 패키지 : 이 파일만 교체하면 다른 편이 된다 -->
<script src="content/c1/scenario.js"></script>
<!-- 엔진 : 콘텐츠를 모른다 -->
<script src="js/engine.js"></script>
</body>
</html>
